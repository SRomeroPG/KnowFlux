# Decimal vectors (PLAN F-N1..F-N4; spec l.582-583; E-0017).
# Strings may be written as {repeat: [text, n]} or {cat: [part, ...]} (expanded by the runner).

# F-N1: [a, b, compareDecimal(a, b)]; equalsDecimal agrees (true iff 0)
compare:
  - ["4.20", "4.2", 0]
  - ["-0", "0", 0]
  - ["-0.00", "0", 0]
  - ["007", "7", 0]
  - ["1", "1.0000", 0]
  - ["-4.2", "4.2", -1]
  - ["10", "9", 1]
  - ["-10", "-9", -1]
  - ["0.3", "0.30000000000000004", -1]
  - ["9007199254740993", "9007199254740992", 1]
  - [{cat: ["1", {repeat: ["0", 400]}]}, {repeat: ["9", 400]}, 1]
  - [{cat: ["0.", {repeat: ["0", 500]}, "1"]}, "0", 1]
  - ["-0.0000000000000000000000000001", "0", -1]
  - ["5", "-5", 1]
  - ["0.5", "0.05", 1]

# F-N2: [op, a, b, formatDecimal(result)]
arithmetic:
  - [add, "0.1", "0.2", "0.3"]
  - [add, "9007199254740992", "1", "9007199254740993"]
  - [subtract, "0.3", "0.1", "0.2"]
  - [subtract, "1", "1.000", "0"]
  - [multiply, "1.5", "-2.5", "-3.75"]
  - [multiply, "123456789012345678901234567890", "987654321098765432109876543210", "121932631137021795226185032733622923332237463801111263526900"]
  - [multiply, "0.000001", "0.000001", "0.000000000001"]
  - [add, "-0", "-0", "0"]
  - [multiply, "-0", "5", "0"]

# F-N3: [text, formatDecimal(parseDecimal(text))]
canonical:
  - ["4.20", "4.2"]
  - ["-0", "0"]
  - ["007.500", "7.5"]
  - ["0.0", "0"]
  - ["-0.50", "-0.5"]
  - ["100", "100"]
  - ["0.001", "0.001"]
  - ["1000.000", "1000"]

# F-N4: strings that are not decimals (INVALID_DECIMAL; isDecimalString false)
rejected_strings:
  - "4,2"
  - ".5"
  - "5."
  - "1e3"
  - "1E3"
  - "+1"
  - ""
  - " 4.2"
  - "4.2 "
  - "4.2\n"
  - "--1"
  - "-"
  - "0x10"
  - "NaN"
  - "Infinity"
  - "1_000"
  - "٣"
  - "4.2.1"
accepted_strings: ["4.2", "-0", "007", "0.10"]

  # F-D14 (E-0024 (4)): names that are not a branch. The scratch repository has branch main (4 commits), a tag
  # named main at HEAD~2, a tag v1, and a reflog for main. Each must reject CANONICAL_BRANCH_UNRESOLVED.
  not_a_branch:
    - "main~1"
    - "main^"
    - "main^0"
    - "main@{0}"
    - "main@{yesterday}"
    - "@{-1}"
    - "HEAD"
    - "v1"
    - "tags/v1"
    - "refs/tags/v1"
    - "refs/heads/main"
    - "origin/main"
    - "main..HEAD"
    - "a..b"
    - "a b"
    - "a~b"
    - "a:b"
    - "a?b"
    - "a*b"
    - "a[b"
    - "a//b"
    - "a.lock"
    - ".hidden"
    - "-x"

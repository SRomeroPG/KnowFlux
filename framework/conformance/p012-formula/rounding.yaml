# Rounding vectors. Source: PLAN F-R (R1, R2, R3), F-W5; clause l.584 ("rounding: {mode: half-even | half-up | down | up,
# decimals: N}") and E-0032 (2): half-even ties to even, half-up ties away from zero, down toward zero, up away from zero;
# exactly `decimals` fraction digits, trailing zeros kept, a negative zero renders non-negative.
# Row layout: [input, half-even, half-up, down, up]. `modes` fixes the column order.
modes: [half-even, half-up, down, up]

# R1: decimals 0
r1:
  - ["2.5", "2", "3", "2", "3"]
  - ["3.5", "4", "4", "3", "4"]
  - ["-2.5", "-2", "-3", "-2", "-3"]
  - ["-3.5", "-4", "-4", "-3", "-4"]
  - ["2.4", "2", "2", "2", "3"]
  - ["2.6", "3", "3", "2", "3"]
  - ["-2.4", "-2", "-2", "-2", "-3"]
  - ["-2.6", "-3", "-3", "-2", "-3"]
  - ["2", "2", "2", "2", "2"]
  - ["-2", "-2", "-2", "-2", "-2"]
  - ["0.4", "0", "0", "0", "1"]
  - ["0.5", "0", "1", "0", "1"]
  - ["-0.4", "0", "0", "0", "-1"]
  - ["-0.5", "0", "-1", "0", "-1"]

# R2: decimals 2
r2:
  - ["1.005", "1.00", "1.01", "1.00", "1.01"]
  - ["1.015", "1.02", "1.02", "1.01", "1.02"]
  - ["1.025", "1.02", "1.03", "1.02", "1.03"]
  - ["-1.005", "-1.00", "-1.01", "-1.00", "-1.01"]
  - ["-1.015", "-1.02", "-1.02", "-1.01", "-1.02"]
  - ["1.001", "1.00", "1.00", "1.00", "1.01"]
  - ["1.999", "2.00", "2.00", "1.99", "2.00"]
  - ["-0.001", "0.00", "0.00", "0.00", "-0.01"]
  - ["0.005", "0.00", "0.01", "0.00", "0.01"]
  - ["1.00", "1.00", "1.00", "1.00", "1.00"]
  # additional sign/tie rows derived from E-0032 (2) (same rule, other signs and ties)
  - ["-1.025", "-1.02", "-1.03", "-1.02", "-1.03"]
  - ["-0.005", "0.00", "-0.01", "0.00", "-0.01"]
  - ["0.015", "0.02", "0.02", "0.01", "0.02"]
  - ["0.025", "0.02", "0.03", "0.02", "0.03"]

# R1b (extra, E-0032 (2)): decimals 1
r1b:
  - ["0.25", "0.2", "0.3", "0.2", "0.3"]
  - ["0.35", "0.4", "0.4", "0.3", "0.4"]
  - ["-0.25", "-0.2", "-0.3", "-0.2", "-0.3"]
  - ["-0.35", "-0.4", "-0.4", "-0.3", "-0.4"]
  - ["0.05", "0.0", "0.1", "0.0", "0.1"]
  - ["-0.05", "0.0", "-0.1", "0.0", "-0.1"]
  - ["0.15", "0.2", "0.2", "0.1", "0.2"]

# W5 (PLAN F-W5): the spec example (l.641-652) with f = "0" so the value is c itself, rounding mode replaced, decimals 4.
w5:
  - ["0.00005", "0.0000", "0.0001", "0.0000", "0.0001"]
  - ["0.00015", "0.0002", "0.0002", "0.0001", "0.0002"]
  - ["0.00025", "0.0002", "0.0003", "0.0002", "0.0003"]
  - ["0.00035", "0.0004", "0.0004", "0.0003", "0.0004"]
  - ["-0.00015", "-0.0002", "-0.0002", "-0.0001", "-0.0002"]
  - ["-0.00005", "0.0000", "-0.0001", "0.0000", "-0.0001"]

# R3: rendering with exactly `decimals` digits. Row: [input, decimals, expected]. {zeros: n} appends n zeros.
r3:
  - ["3.78", 4, "3.7800"]
  - ["5", 2, "5.00"]
  - ["5", 0, "5"]
  - ["0", 3, "0.000"]
  - ["-0", 2, "0.00"]
  - ["0.5", 1, "0.5"]
  - ["1", 30, {prefix: "1.", zeros: 30}]
  - ["1", 100, {prefix: "1.", zeros: 100}]
